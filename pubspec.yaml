name: cyberneurova_mobile
description: CyberNeurova AI Chat — iOS & Android mobile app
publish_to: none
version: 1.0.1+45

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.0

  # Auth & Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # JSON serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  flutter_markdown: ^0.7.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  flutter_highlight: ^0.7.0

  # Animations
  flutter_animate: ^4.5.0

  # Swipe actions on drawer recents (Archive / Delete) — replaced the
  # hand-rolled Dismissible: Slidable panes lock open for a deliberate
  # second tap instead of one-swipe-deletes.
  flutter_slidable: ^4.0.0

  # Typography (loads Inter from Google Fonts CDN — no manual font files)
  google_fonts: ^6.2.1

  # Splash screen (runtime — used in main.dart)
  flutter_native_splash: ^2.4.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  # Direct dep because ShellSession resolves/normalises session paths with it
  # (was transitive). Keeps the sandbox-escape check correct on every path
  # style, so it can be unit-tested off-device.
  path: ^1.9.0
  path_provider: ^2.1.3
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.1
  file_picker: ^8.0.6
  # Getting a file back OUT of the session. Declares its own FileProvider,
  # which is what makes an app-private file shareable at all — doing it by
  # hand means a manifest provider plus an xml paths file plus the Kotlin to
  # build the content:// URI.
  share_plus: ^10.1.4
  gal: ^2.3.0
  record: ^5.1.2
  video_player: ^2.9.1
  # TTS playback — assistant message speaker button + voice-mode auto-play.
  # `just_audio` handles the WAV bytes returned by /api/mobile/v1/tts via
  # AudioSource.uri with a data: URL OR by writing the buffer to a temp
  # file first (we do the latter — simpler, lets us cache by messageId
  # for the session so re-tapping a message doesn't re-bill).
  just_audio: ^0.9.40
  # Explicit dep (transitive via just_audio). Used to force the shared
  # AVAudioSession into record/speech mode before starting the mic — if
  # TTS played first, the session stays in `playback` and the record
  # package's default doesn't override it, so the mic captures silence.
  # Apple's 2.1(a) rejection on build 36 traced back to this.
  audio_session: ^0.1.25

  # In-app webview for the cryptomus / card checkout pages (Android only —
  # iOS hides the entire billing surface per App Store rules).
  webview_flutter: ^4.10.0
  # Store IAP (StoreKit 2 on iOS, Play Billing on Android) — the backend API.
  # Purchases are verified server-side via POST /iap/verify before being
  # finished/acknowledged; web checkout stays as the fallback path while
  # Play Console products don't exist yet.
  in_app_purchase: ^3.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.0 # SHA-256 for the Apple Sign-In replay-protection nonce
  convert: ^3.1.1 # AccumulatorSink: hash a rootfs download as it streams
  flutter_math_fork: ^0.7.4
  flutter_pty: ^0.4.2
  xterm: ^4.0.0
  flutter_web_auth_2: ^5.0.3
  http: ^1.2.0 # PKCE token exchange talks to Google directly, not our API

# Pin transitive deps that have version-mismatch issues.
# `record_linux 0.7.2` (pulled by record 5.1.2) doesn't implement the latest
# record_platform_interface — bump to a version that does.
dependency_overrides:
  record_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.3
  # Icon generation (run once before building)
  flutter_launcher_icons: ^0.14.1

# ─── App icon configuration ──────────────────────────────────────────────────
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"           # Square 1024×1024 CN logo
  min_sdk_android: 21

  # Android adaptive icon (API 26+)
  adaptive_icon_background: "#0B1221"               # App dark background
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"  # CN logo, centred with padding

  # Small notification icon (mono, white on transparent)
  android_notification_icon: "assets/icons/app_icon_mono.png"

  # iOS-specific
  remove_alpha_ios: true                            # App Store requires no alpha channel

# ─── Splash screen configuration ─────────────────────────────────────────────
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B1221"                                  # Same as scaffoldBackgroundColor
  # Splash uses the PADDED mark (app_icon_splash, ~58%) — the Android-12 splash
  # masks the icon to the central ~66%, so the full-bleed app_icon would clip the
  # mark's dots. The padded variant keeps the whole mark (dots included) visible.
  image: "assets/icons/app_icon_splash.png"
  color_dark: "#0B1221"
  image_dark: "assets/icons/app_icon_splash.png"

  android_12:
    color: "#0B1221"
    image: "assets/icons/app_icon_splash.png"
    icon_background_color: "#0B1221"

  # Brands the splash on both platforms properly
  fullscreen: true
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true                          # Enables ARB-based l10n codegen
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  # Bundled fonts. Previously these came from the Google Fonts CDN at RUNTIME,
  # which cost a network round-trip on first launch and made the splash
  # wordmark re-layout mid-animation on a slow connection (and fail entirely
  # offline). Inter and JetBrains Mono are variable fonts — one file covers
  # every weight, so this costs ~1.1 MB total rather than one file per weight.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    # Terminal / code. A shell is unreadable in a proportional face, so this
    # is a functional dependency of the Shell workspace, not decoration.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
