# Tuned for CI runners (ubuntu-latest has 7GB RAM). Anything above ~5G
# total here gets OOM-killed by the kernel mid-bundleRelease (exit 143).
# 4G heap + 1G metaspace builds the release AAB fine; local dev boxes have
# plenty of headroom to spare so this isn't a regression on workstations.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# LOCAL ONLY (do not commit): Windows Kotlin incremental-cache file-lock workaround
kotlin.incremental=false
